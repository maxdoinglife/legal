<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bank link callback</title>
<style>
  body { margin: 0; background: #f9f9f7; color: #0b0b0b; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .meta { color: #52514e; font-size: 14px; }
  textarea { width: 100%; min-height: 96px; margin: 14px 0 8px; padding: 10px; font: 13px/1.4 ui-monospace, Menlo, monospace; border: 1px solid rgba(11,11,11,0.2); border-radius: 8px; background: #fcfcfb; color: inherit; }
  button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid rgba(11,11,11,0.2); background: #fcfcfb; color: inherit; cursor: pointer; }
  .ok { color: #006300; } .bad { color: #d03b3b; }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #f0efec; } .meta { color: #c3c2b7; } textarea, button { background: #1a1a19; border-color: rgba(255,255,255,0.15); } .ok { color: #0ca30c; } }
</style>
</head>
<body>
<main>
  <h1 id="h">Bank link callback</h1>
  <p class="meta">This page only shows what the bank sent back. Nothing is stored or sent anywhere. Personal application operated by Max Lamprell.</p>
  <p id="msg"></p>
  <textarea id="url" readonly aria-label="Redirect URL to paste into the terminal"></textarea>
  <button id="copy" type="button">Copy URL</button>
  <span id="copied" class="meta"></span>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var msg = document.getElementById('msg'), ta = document.getElementById('url');
  ta.value = location.href;
  if (q.get('code')) {
    msg.className = 'ok';
    msg.textContent = 'Authorised. Go back to the terminal and paste this URL at the "Redirect URL:" prompt.';
  } else if (q.get('error')) {
    msg.className = 'bad';
    msg.textContent = 'The bank returned an error: ' + q.get('error') + (q.get('error_description') ? ' - ' + q.get('error_description') : '');
  } else {
    msg.textContent = 'No authorisation code in this URL. Start the link again from the terminal.';
  }
  document.getElementById('copy').addEventListener('click', function () {
    ta.select();
    var done = function () { document.getElementById('copied').textContent = 'Copied.'; };
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, function () { document.execCommand('copy'); done(); });
    else { document.execCommand('copy'); done(); }
  });
})();
</script>
</body>
</html>
